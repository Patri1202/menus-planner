<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo redondeado con esquinas suaves (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Elementos principales (Plato y Cubiertos) con sombra suave -->
  <g filter="url(#dropShadow)">
    <!-- Plato central -->
    <circle cx="256" cy="256" r="118" fill="url(#plateGrad)" />
    <circle cx="256" cy="256" r="118" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.8" />
    <circle cx="256" cy="256" r="88" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="5" />
    <circle cx="256" cy="256" r="76" fill="#FFFFFF" />

    <!-- Detalle culinario central (hojitas frescas / estilo gourmet) -->
    <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
      <path d="M256 224 C274 228 286 244 286 260 C270 260 254 248 256 224 Z" fill="url(#leafGrad)" />
      <path d="M256 260 C240 260 226 244 226 228 C242 228 258 240 256 260 Z" fill="#059669" />
      <path d="M256 230 L256 282" stroke="#047857" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Tenedor (Izquierda) -->
    <g fill="#FFFFFF">
      <!-- 4 Púas -->
      <rect x="76" y="148" width="6" height="58" rx="3" />
      <rect x="86" y="148" width="6" height="58" rx="3" />
      <rect x="96" y="148" width="6" height="58" rx="3" />
      <rect x="106" y="148" width="6" height="58" rx="3" />
      <!-- Base y Mango -->
      <path d="M76 192 C76 218 86 230 91 236 L91 348 C87 352 83 358 83 366 C83 372 87 376 94 376 C101 376 105 372 105 366 C105 358 101 352 97 348 L97 236 C102 230 112 218 112 192 Z" />
    </g>

    <!-- Cuchillo (Derecha) -->
    <g fill="#FFFFFF">
      <path d="M418 148 C418 148 402 174 402 212 C402 234 414 242 415 248 L415 348 C411 352 407 358 407 366 C407 372 411 376 418 376 C425 376 429 372 429 366 C429 358 425 352 421 348 L421 152 C421 148 420 148 418 148 Z" />
    </g>
  </g>
</svg>